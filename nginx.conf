# Serves the Next.js static export the way the docs site expects:
#   /example            → /example.html
#   /example/atoms/x    → /example/atoms/x.html
#   anything unknown    → 404.html with a real 404 status
# Immutable asset caching for /_next/static, which Next fingerprints.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
