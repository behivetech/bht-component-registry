# Versioning and publishing with Changesets.
#
# On every push to main, changesets/action either opens (or updates) a
# "Version Packages" pull request from the pending .changeset/*.md files, or,
# when that PR has just been merged, publishes the bumped packages to the
# registry in registry.config.json.
#
# Default: npm trusted publishing (OIDC). No secret: after the first manual
# publish of each package, add a trusted publisher on its npmjs settings page
# (owner, this repository, workflow file "release.yml"), then set the
# repository variable NPM_TRUSTED_PUBLISHING=true. Provenance is automatic.
#
# Fallback: a granular access token (write, "Bypass 2FA", 90 days at most)
# stored as the secret NPM_TOKEN. The variable wins when both exist.
#
# GitHub Packages for everything instead: set "npmRegistry" to
# https://npm.pkg.github.com in registry.config.json and pass
# `NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}` below instead of the npm token.
#
# Public AND private packages: keep npmRegistry for the public ones and set
# "privateRegistry" (GitHub Packages, Verdaccio, …) for the private ones; the
# "Private registry auth" step below adds that registry's token. See
# apps/docs/default-docs/guide/publishing.md, "Public and private packages".
#
# See apps/docs/default-docs/guide/publishing.md.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # Private packages on GitHub Packages publish with the job's own token.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # changesets/action publishes whenever there are no pending changesets,
      # which on a fresh repo would try to push every package on the first
      # merge to main. Until a publish method is configured the action only
      # versions (release PRs still open; nothing publishes) and says so, so a
      # fresh repo's first pushes stay green.
      - name: Decide how to publish
        id: publish
        env:
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$NPM_TRUSTED_PUBLISHING" = "true" ]; then
            echo "method=trusted" >> "$GITHUB_OUTPUT"
          elif [ -n "$NPM_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing is off (release PRs still open): set the repository variable NPM_TRUSTED_PUBLISHING=true (after adding a trusted publisher on npmjs) or the secret NPM_TOKEN. See apps/docs/default-docs/guide/publishing.md."
          fi

      # Private packages (publishConfig.registry = registry.config.json#privateRegistry)
      # authenticate with PRIVATE_REGISTRY_TOKEN, or with the job's GITHUB_TOKEN
      # when the private registry is GitHub Packages. The line goes in the
      # runner's ~/.npmrc, keyed by host, so public packages still publish to
      # npmjs the way the next step decides. Nothing happens when the config
      # names no private registry.
      - name: Private registry auth
        if: steps.publish.outputs.method != 'none'
        env:
          PRIVATE_REGISTRY_TOKEN: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry=$(node -e 'const c=require("./registry.config.json");process.stdout.write(c.privateRegistry||"")')
          if [ -z "$registry" ]; then exit 0; fi
          host=$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$registry")
          token="$PRIVATE_REGISTRY_TOKEN"
          if [ -z "$token" ] && [ "$host" = "npm.pkg.github.com" ]; then token="$GITHUB_TOKEN"; fi
          if [ -z "$token" ]; then
            echo "::error::registry.config.json names privateRegistry $registry but the secret PRIVATE_REGISTRY_TOKEN is not set; private packages would fail to publish." >&2
            exit 1
          fi
          echo "//$host/:_authToken=$token" >> "$HOME/.npmrc"
          echo "Private packages publish to $host."

      # Versioning always runs, so pending changesets always become a release
      # PR; only the `publish` input depends on the decision above, and with no
      # method the action versions only. With no NPM_TOKEN the action writes no
      # .npmrc and `changeset publish` (pnpm publish) authenticates with the
      # job's OIDC token.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ steps.publish.outputs.method != 'none' && 'pnpm release' || '' }}
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ steps.publish.outputs.method == 'token' && secrets.NPM_TOKEN || '' }}

      # Optional, for an expanded version that tracks releases:
      # tell it which packages were just published so their docs appear
      # immediately rather than on its next look at the registry. Uncomment
      # once you have a scope there and store its secret as REGISTRY_NOTIFY_TOKEN.
      #
      # - name: Notify the expanded version
      #   if: steps.publish.outputs.method != 'none' && steps.changesets.outputs.published == 'true'
      #   run: |
      #     curl -fsS -X POST https://platform.behivetech.com/api/published \
      #       -H "Authorization: Bearer ${{ secrets.REGISTRY_NOTIFY_TOKEN }}" \
      #       -H "Content-Type: application/json" \
      #       -d '${{ steps.changesets.outputs.publishedPackages }}'
