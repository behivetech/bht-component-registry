# Continuous integration for the registry and its docs site.
#
# The site is a static export and the tests run against that export. One secret
# is needed for now: PACKAGES_READ_TOKEN, a GitHub token with read:packages,
# because the @behivetech packages (the shared class-name helper's consumers, the
# docs site's chrome) install from GitHub Packages until they are on the public
# npm registry again (see .npmrc). A pull request from a fork gets no secrets,
# so its install fails; a maintainer re-runs it from a branch. If you don't want
# CI, delete this file — nothing else references it. See
# apps/docs/default-docs/guide/testing-and-ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm check:publish` (in verify) reads each package's release tags
          # to refuse a change of registry after a release; a shallow clone
          # has no tags and would let one through.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The token line lives in the runner's user-level ~/.npmrc: pnpm 11 ignores
      # an environment-expanded credential in the project .npmrc (see .npmrc).
      - name: GitHub Packages auth
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
      - run: pnpm install --frozen-lockfile
      - name: Nothing may come from a registry we do not name
        run: |
          # npmjs and GitHub Packages (temporary, see .npmrc) are the only
          # registries a lockfile may point at; any other host is a private
          # registry a public template must not depend on.
          bad=$(grep -oE 'tarball: https?://[^/]+' pnpm-lock.yaml | grep -vE 'https?://(registry\.npmjs\.org|npm\.pkg\.github\.com)$' | sort -u || true)
          if [ -n "$bad" ]; then
            echo "pnpm-lock.yaml references a registry other than npmjs or GitHub Packages:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - run: pnpm verify

  e2e:
    name: Playwright against the static build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The token line lives in the runner's user-level ~/.npmrc: pnpm 11 ignores
      # an environment-expanded credential in the project .npmrc (see .npmrc).
      - name: GitHub Packages auth
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7
