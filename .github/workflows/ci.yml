# Continuous integration for the registry and its docs site.
#
# Nothing here needs a secret: the site is a static export and the tests run
# against that export. If you don't want CI, delete this file — nothing else
# references it. See apps/docs/default-docs/guide/testing-and-ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm check:publish` (in verify) reads each package's release tags
          # to refuse a change of registry after a release; a shallow clone
          # has no tags and would let one through.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # TEMPORARY until every @behivetech package is on the public npm registry:
      # the docs site's chrome installs from GitHub Packages (see .npmrc).
      - name: GitHub Packages read auth
        run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_READ_TOKEN}" >> "$HOME/.npmrc"
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Nothing may come from a private registry
        run: |
          # The @behivetech chrome is the one allowed exception, until that scope is
          # fully on the public registry (see .npmrc).
          if grep "npm.pkg.github.com" pnpm-lock.yaml | grep -v "@behivetech/" | grep -q .; then
            echo "pnpm-lock.yaml references GitHub Packages for something other than @behivetech; a public template must install with no token." >&2
            exit 1
          fi
      - run: pnpm verify

  e2e:
    name: Playwright against the static build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # TEMPORARY until every @behivetech package is on the public npm registry:
      # the docs site's chrome installs from GitHub Packages (see .npmrc).
      - name: GitHub Packages read auth
        run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_READ_TOKEN}" >> "$HOME/.npmrc"
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7
